<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="385" viewBox="0 0 1200 385" role="img" aria-label="Animated technology playground: Data, AI and ML, Web and APIs, and developer tools. Learning interests, not proficiency scores.">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0B1523"/><stop offset="1" stop-color="#112D35"/></linearGradient></defs>
<rect x="1" y="1" width="1198" height="383" rx="18" fill="url(#bg)" stroke="#254652"/>
<text x="35" y="41" fill="#5EEAD4" font-family="monospace" font-size="12" letter-spacing="3">TECHNOLOGY PLAYGROUND</text>
<text x="34" y="80" fill="#F1F5F9" font-family="Arial,sans-serif" font-size="28" font-weight="700">Explore the tools. Connect the ideas.</text>
<text x="35" y="108" fill="#90AAB8" font-family="Arial,sans-serif" font-size="14">A learning ecosystem across data, intelligence, applications and engineering.</text>
<path d="M165 247H1035" stroke="#286365" stroke-width="2"/>
<circle r="4" fill="#99F6E4"><animateMotion path="M165 247H1035" dur="6s" repeatCount="indefinite"/></circle>
<g transform="translate(35 143)">
<rect width="260" height="92" rx="12" fill="#101F30" stroke="#284552"/>
<rect width="260" height="92" rx="12" fill="none" stroke="#5EEAD4" stroke-width="1.5" opacity=".15"><animate attributeName="opacity" values=".15;.8;.15" dur="6s" begin="0.0s" repeatCount="indefinite"/></rect>
<text x="18" y="25" fill="#5EEAD4" font-family="monospace" font-size="11">01 / EXPLORE</text>
<text x="18" y="55" fill="#F1F5F9" font-family="Arial,sans-serif" font-size="22" font-weight="700">DATA</text>
<text x="18" y="77" fill="#A4BAC8" font-family="monospace" font-size="11">Python / NumPy / Pandas</text>
<circle cx="130" cy="104" r="5" fill="#5EEAD4"><animate attributeName="r" values="4;6;4" dur="4s" begin="0.0s" repeatCount="indefinite"/></circle>
<text x="130" y="134" text-anchor="middle" fill="#90AAB8" font-family="Arial,sans-serif" font-size="13">Observe. Prepare. Understand.</text>
</g>
<g transform="translate(325 143)">
<rect width="260" height="92" rx="12" fill="#101F30" stroke="#284552"/>
<rect width="260" height="92" rx="12" fill="none" stroke="#60A5FA" stroke-width="1.5" opacity=".15"><animate attributeName="opacity" values=".15;.8;.15" dur="6s" begin="1.5s" repeatCount="indefinite"/></rect>
<text x="18" y="25" fill="#60A5FA" font-family="monospace" font-size="11">02 / EXPLORE</text>
<text x="18" y="55" fill="#F1F5F9" font-family="Arial,sans-serif" font-size="22" font-weight="700">AI &amp; ML</text>
<text x="18" y="77" fill="#A4BAC8" font-family="monospace" font-size="11">PyTorch / TensorFlow</text>
<circle cx="130" cy="104" r="5" fill="#60A5FA"><animate attributeName="r" values="4;6;4" dur="4s" begin="0.5s" repeatCount="indefinite"/></circle>
<text x="130" y="134" text-anchor="middle" fill="#90AAB8" font-family="Arial,sans-serif" font-size="13">Experiment. Evaluate. Learn.</text>
</g>
<g transform="translate(615 143)">
<rect width="260" height="92" rx="12" fill="#101F30" stroke="#284552"/>
<rect width="260" height="92" rx="12" fill="none" stroke="#C4B5FD" stroke-width="1.5" opacity=".15"><animate attributeName="opacity" values=".15;.8;.15" dur="6s" begin="3.0s" repeatCount="indefinite"/></rect>
<text x="18" y="25" fill="#C4B5FD" font-family="monospace" font-size="11">03 / EXPLORE</text>
<text x="18" y="55" fill="#F1F5F9" font-family="Arial,sans-serif" font-size="22" font-weight="700">WEB &amp; APIs</text>
<text x="18" y="77" fill="#A4BAC8" font-family="monospace" font-size="11">React / Node.js / FastAPI</text>
<circle cx="130" cy="104" r="5" fill="#C4B5FD"><animate attributeName="r" values="4;6;4" dur="4s" begin="1.0s" repeatCount="indefinite"/></circle>
<text x="130" y="134" text-anchor="middle" fill="#90AAB8" font-family="Arial,sans-serif" font-size="13">Build useful interfaces.</text>
</g>
<g transform="translate(905 143)">
<rect width="260" height="92" rx="12" fill="#101F30" stroke="#284552"/>
<rect width="260" height="92" rx="12" fill="none" stroke="#FCD34D" stroke-width="1.5" opacity=".15"><animate attributeName="opacity" values=".15;.8;.15" dur="6s" begin="4.5s" repeatCount="indefinite"/></rect>
<text x="18" y="25" fill="#FCD34D" font-family="monospace" font-size="11">04 / EXPLORE</text>
<text x="18" y="55" fill="#F1F5F9" font-family="Arial,sans-serif" font-size="22" font-weight="700">DEV TOOLS</text>
<text x="18" y="77" fill="#A4BAC8" font-family="monospace" font-size="11">Git / Docker / Linux</text>
<circle cx="130" cy="104" r="5" fill="#FCD34D"><animate attributeName="r" values="4;6;4" dur="4s" begin="1.5s" repeatCount="indefinite"/></circle>
<text x="130" y="134" text-anchor="middle" fill="#90AAB8" font-family="Arial,sans-serif" font-size="13">Version. Package. Iterate.</text>
</g>
<rect x="35" y="310" width="1130" height="47" rx="9" fill="#081421" stroke="#233E49"/>
<text x="53" y="339" fill="#5EEAD4" font-family="monospace" font-size="14">&gt; curiosity + practice + iteration</text>
<rect x="354" y="324" width="8" height="19" fill="#5EEAD4"><animate attributeName="opacity" values="1;1;0;0;1" dur="1.6s" repeatCount="indefinite"/></rect>
<text x="1145" y="339" text-anchor="end" fill="#7896A6" font-family="monospace" font-size="11">LEARN / BUILD / ITERATE</text>
</svg>