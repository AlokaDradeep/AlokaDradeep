name: Update contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'
  push:
    paths:
      - '.github/workflows/contribution-snake.yml'

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Generate animation from the repository owner's contributions
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/contribution-snake.svg?palette=github-dark&color_snake=#5EEAD4&color_dots=#182638,#174C49,#147D70,#23B59C,#5EEAD4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save the generated SVG
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contribution-snake.svg
          if git diff --cached --quiet; then
            echo 'Contribution animation is already current.'
            exit 0
          fi
          git commit -m 'Update contribution animation'
          git push
